[tasks."test:runtime"]
description = "Runtime authority, rootless discovery, and CLI private registry contracts"
run = "go test ./internal/workspace ./internal/app ./internal/cli -run 'Runtime|Rootless' -count=1"

[tasks."test:engine"]
description = "Execution fencing and application regression suites"
run = "go test ./internal/execution ./internal/app -count=1"

[tasks."test:lease"]
description = "Real interactive CLI ownership across three leases without model renewals"
env.ATASK_INTERACTIVE_HOST = "{{env.HOME}}/.omp/agent/extensions/atask-lease/host-proof.ts"
run = "go test ./internal/cli -run '^TestInteractiveLeaseHost$' -count=1 -v"

[tasks."test:lease-unit"]
description = "Deterministic interactive lifecycle transitions"
run = "bun test $HOME/.omp/agent/extensions/atask-lease/lease.test.ts"

[tasks."fmt:runtime"]
run = "gofmt -w internal/cli/runtime*.go internal/cli/interactive_host_test.go internal/app/runtime*.go internal/workspace/runtime*.go internal/workspace/session_store.go internal/app/rootless_session.go internal/app/engine.go internal/cli/claim.go internal/cli/root.go"
