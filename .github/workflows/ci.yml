name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # The e2e suite creates task worktrees through Worktrunk; without wt on
      # PATH every workspace test fails. Pinned to the release CI-tested
      # against; bump with the repo's own tool pin.
      - run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/max-sixty/worktrunk/releases/download/v0.81.0/worktrunk-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ -C "$HOME/.local/bin" --strip-components=1 worktrunk-x86_64-unknown-linux-musl/wt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wt" --version
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/app/ ./test/e2e/
